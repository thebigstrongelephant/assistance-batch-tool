<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript调试测试</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .hidden { display: none; }
        .visible { display: block; background: #e3f2fd; padding: 10px; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>JavaScript功能测试</h1>
    
    <div class="test-section">
        <h3>基础JavaScript测试</h3>
        <button onclick="basicTest()">基础测试</button>
        <div id="basicResult"></div>
    </div>
    
    <div class="test-section">
        <h3>下发方式选择测试</h3>
        <select id="sendMethod" onchange="toggleSendMethod()">
            <option value="">请选择下发方式</option>
            <option value="region">按地区下发</option>
            <option value="excel">Excel导入村庄ID</option>
        </select>
        <div>状态：<span id="currentMethod">未选择</span></div>
        
        <div id="regionSendSection" class="hidden">
            <h4>按地区下发区域</h4>
            <p>这是按地区下发的配置区域</p>
        </div>
        
        <div id="excelImportSection" class="hidden">
            <h4>Excel导入区域</h4>
            <p>这是Excel导入的配置区域</p>
        </div>
    </div>
    
    <div class="test-section">
        <h3>手动切换测试</h3>
        <button onclick="showRegion()">显示地区区域</button>
        <button onclick="showExcel()">显示Excel区域</button>
        <button onclick="hideAll()">隐藏所有</button>
    </div>

    <script>
        function basicTest() {
            console.log('基础测试函数被调用');
            document.getElementById('basicResult').innerHTML = '✅ JavaScript正常工作！时间：' + new Date().toLocaleString();
            alert('基础测试成功！');
        }
        
        function toggleSendMethod() {
            console.log('toggleSendMethod 被调用');
            const method = document.getElementById('sendMethod').value;
            console.log('选择的方式:', method);
            
            const regionSection = document.getElementById('regionSendSection');
            const excelSection = document.getElementById('excelImportSection');
            const currentMethodSpan = document.getElementById('currentMethod');
            
            // 更新状态显示
            currentMethodSpan.textContent = method || '未选择';
            
            // 隐藏所有区域
            regionSection.className = 'hidden';
            excelSection.className = 'hidden';
            
            // 显示对应区域
            if (method === 'region') {
                regionSection.className = 'visible';
                console.log('显示地区区域');
            } else if (method === 'excel') {
                excelSection.className = 'visible';
                console.log('显示Excel区域');
            }
        }
        
        function showRegion() {
            document.getElementById('regionSendSection').className = 'visible';
            console.log('手动显示地区区域');
        }
        
        function showExcel() {
            document.getElementById('excelImportSection').className = 'visible';
            console.log('手动显示Excel区域');
        }
        
        function hideAll() {
            document.getElementById('regionSendSection').className = 'hidden';
            document.getElementById('excelImportSection').className = 'hidden';
            console.log('隐藏所有区域');
        }
        
        // 页面加载完成后的测试
        document.addEventListener('DOMContentLoaded', function() {
            console.log('页面加载完成');
            document.getElementById('basicResult').innerHTML = '页面已加载，JavaScript可用';
        });
    </script>
</body>
</html>
