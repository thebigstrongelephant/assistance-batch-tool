<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>助力金批量下发工具 - 修复版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-attachment: fixed;
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3f73 100%);
            color: white;
            padding: 25px 0;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
        }
        
        .header-content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .nav-tabs {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(233,236,239,0.3);
            padding: 0 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
        }
        
        .nav-tabs-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
        }
        
        .nav-tab {
            padding: 18px 30px;
            cursor: pointer;
            border-bottom: 3px solid transparent;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-weight: 500;
            position: relative;
            border-radius: 12px 12px 0 0;
            margin: 0 2px;
        }
        
        .nav-tab:hover {
            background: rgba(44, 90, 160, 0.08);
            transform: translateY(-2px);
        }
        
        .nav-tab.active {
            color: #2c5aa0;
            border-bottom-color: #2c5aa0;
            background: rgba(44, 90, 160, 0.12);
            box-shadow: 0 -2px 12px rgba(44, 90, 160, 0.15);
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 30px 20px;
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        .card {
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.12);
            margin-bottom: 30px;
            border: 1px solid rgba(255,255,255,0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 80px rgba(0,0,0,0.15);
        }
        
        .card-title {
            font-size: 20px;
            font-weight: 600;
            color: #2c5aa0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .form-section {
            margin-bottom: 35px;
            padding: 30px;
            border: 1px solid rgba(233,236,239,0.3);
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(250,251,252,0.8) 0%, rgba(255,255,255,0.6) 100%);
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.06);
            transition: all 0.3s ease;
        }
        
        .section-title {
            font-size: 16px;
            font-weight: 600;
            color: #2c5aa0;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group {
            display: flex;
            flex-direction: column;
            margin-bottom: 20px;
        }
        
        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        
        .form-input, .form-select, .form-textarea {
            padding: 16px 20px;
            border: 2px solid rgba(233,236,239,0.5);
            border-radius: 12px;
            font-size: 14px;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .form-input:focus, .form-select:focus, .form-textarea:focus {
            outline: none;
            border-color: #2c5aa0;
            box-shadow: 0 0 0 4px rgba(44, 90, 160, 0.15);
            background: rgba(255,255,255,0.95);
            transform: translateY(-2px);
        }
        
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #2c5aa0 0%, #1e3f73 100%);
            color: white;
        }
        
        .btn-primary:hover {
            background: linear-gradient(135deg, #1e3f73 0%, #2c5aa0 100%);
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(44, 90, 160, 0.3);
        }
        
        .hidden-section {
            display: none;
        }
        
        .visible-section {
            display: block;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { 
                opacity: 0; 
                transform: translateY(-20px) scale(0.95); 
            }
            to { 
                opacity: 1; 
                transform: translateY(0) scale(1); 
            }
        }
        
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #c3e6cb;
        }
        
        .error-message {
            background: #f8d7da;
            color: #721c24;
            padding: 12px;
            border-radius: 6px;
            margin: 10px 0;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-content">
            <h1>🎯 善治美平台公益 to C 开放 - 助力金发放工具</h1>
            <div class="user-info">
                <span>管理员：张三</span>
                <span>|</span>
                <span id="currentTime">2025-11-12 15:30</span>
            </div>
        </div>
    </div>

    <div class="nav-tabs">
        <div class="nav-tabs-container">
            <div class="nav-tab active" data-tab="batch-send">📤 批量下发配置</div>
            <div class="nav-tab" data-tab="activity-config">⚙️ 运营活动配置</div>
            <div class="nav-tab" data-tab="history-tasks">📋 发放任务列表</div>
            <div class="nav-tab" data-tab="audit-management">🔍 审核管理</div>
        </div>
    </div>

    <div class="container">
        <!-- 批量下发配置 -->
        <div id="batch-send" class="tab-content active">
            <div class="card">
                <div class="card-title">📤 批量下发配置</div>
                <p style="color: #666; margin-bottom: 30px;">配置助力金批量下发任务，支持按地区下发和Excel导入两种方式</p>
                
                <!-- 下发方式选择 -->
                <div class="form-section">
                    <div class="section-title">📋 下发方式选择</div>
                    <div class="form-group">
                        <label class="form-label">下发方式</label>
                        <select class="form-select" id="sendMethod">
                            <option value="">请选择下发方式</option>
                            <option value="region">按地区下发</option>
                            <option value="excel">Excel导入村庄ID</option>
                        </select>
                        <div class="status-display" style="margin-top: 10px; color: #666;">
                            当前状态：<span id="currentMethod" style="font-weight: bold; color: #2c5aa0;">未选择</span>
                        </div>
                    </div>
                </div>

                <!-- 按地区下发 -->
                <div class="form-section hidden-section" id="regionSendSection">
                    <div class="section-title">🌍 选择地区下发</div>
                    <div class="form-group">
                        <label class="form-label">选择地区</label>
                        <select class="form-select" id="province">
                            <option value="">选择省份</option>
                            <option value="all">✅ 全国</option>
                            <option value="yunnan">云南省</option>
                            <option value="hebei">河北省</option>
                            <option value="beijing">北京市</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">助力金金额（元）</label>
                        <input type="number" class="form-input" id="regionAmount" placeholder="请输入统一金额" min="0.01" step="0.01">
                    </div>
                    <button class="btn btn-primary" onclick="submitRegionTask()">
                        ✅ 提交任务
                    </button>
                </div>

                <!-- Excel导入 -->
                <div class="form-section hidden-section" id="excelImportSection">
                    <div class="section-title">📊 Excel数据导入</div>
                    <div class="form-group">
                        <label class="form-label">上传Excel文件</label>
                        <input type="file" class="form-input" id="fileInput" accept=".xlsx,.xls">
                    </div>
                    <button class="btn btn-primary" onclick="processExcelFile()">
                        📤 处理文件
                    </button>
                </div>

                <!-- 结果显示 -->
                <div id="resultSection" class="hidden-section">
                    <div class="success-message" id="successMessage"></div>
                </div>
            </div>
        </div>

        <!-- 其他标签页内容 -->
        <div id="activity-config" class="tab-content">
            <div class="card">
                <div class="card-title">⚙️ 运营活动配置</div>
                <p>运营活动配置功能开发中...</p>
            </div>
        </div>

        <div id="history-tasks" class="tab-content">
            <div class="card">
                <div class="card-title">📋 发放任务列表</div>
                <p>发放任务列表功能开发中...</p>
            </div>
        </div>

        <div id="audit-management" class="tab-content">
            <div class="card">
                <div class="card-title">🔍 审核管理</div>
                <p>审核管理功能开发中...</p>
            </div>
        </div>
    </div>

    <script>
        console.log('🚀 页面开始加载...');

        // 切换标签页
        function switchTab(tabId) {
            console.log('切换到标签页:', tabId);
            
            // 隐藏所有标签页内容
            document.querySelectorAll('.tab-content').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 移除所有标签的active类
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            // 显示选中的标签页内容
            const targetTab = document.getElementById(tabId);
            if (targetTab) {
                targetTab.classList.add('active');
            }
            
            // 添加active类到选中的标签
            const activeTab = document.querySelector(`[data-tab="${tabId}"]`);
            if (activeTab) {
                activeTab.classList.add('active');
            }
        }

        // 切换下发方式
        function toggleSendMethod() {
            const method = document.getElementById('sendMethod').value;
            const currentMethodSpan = document.getElementById('currentMethod');
            const regionSection = document.getElementById('regionSendSection');
            const excelSection = document.getElementById('excelImportSection');
            
            console.log('选择的下发方式:', method);
            
            currentMethodSpan.textContent = method || '未选择';
            
            // 隐藏所有区域
            regionSection.className = 'form-section hidden-section';
            excelSection.className = 'form-section hidden-section';
            
            // 显示对应区域
            if (method === 'region') {
                regionSection.className = 'form-section visible-section';
            } else if (method === 'excel') {
                excelSection.className = 'form-section visible-section';
            }
        }

        // 提交地区任务
        function submitRegionTask() {
            const province = document.getElementById('province').value;
            const amount = document.getElementById('regionAmount').value;
            
            if (!province || !amount) {
                alert('请填写完整信息');
                return;
            }
            
            const resultSection = document.getElementById('resultSection');
            const successMessage = document.getElementById('successMessage');
            
            successMessage.innerHTML = `
                ✅ 任务提交成功！<br>
                地区：${province}<br>
                金额：${amount}元<br>
                任务ID：TASK${Date.now()}
            `;
            
            resultSection.className = 'visible-section';
            
            console.log('地区任务提交成功');
        }

        // 处理Excel文件
        function processExcelFile() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('请选择Excel文件');
                return;
            }
            
            const resultSection = document.getElementById('resultSection');
            const successMessage = document.getElementById('successMessage');
            
            successMessage.innerHTML = `
                ✅ Excel文件处理成功！<br>
                文件名：${file.name}<br>
                文件大小：${(file.size / 1024).toFixed(2)} KB<br>
                任务ID：TASK${Date.now()}
            `;
            
            resultSection.className = 'visible-section';
            
            console.log('Excel文件处理成功');
        }

        // 更新时间
        function updateTime() {
            const now = new Date();
            const timeElement = document.getElementById('currentTime');
            if (timeElement) {
                timeElement.textContent = now.toLocaleString();
            }
        }

        // 页面初始化
        document.addEventListener('DOMContentLoaded', function() {
            console.log('📄 DOM加载完成，开始初始化...');
            
            // 绑定下发方式选择事件
            const sendMethodSelect = document.getElementById('sendMethod');
            if (sendMethodSelect) {
                sendMethodSelect.addEventListener('change', toggleSendMethod);
                console.log('✅ 下发方式选择事件绑定成功');
            }
            
            // 绑定标签页切换事件
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    const tabId = this.getAttribute('data-tab');
                    switchTab(tabId);
                });
            });
            console.log('✅ 标签页切换事件绑定成功');
            
            // 更新时间
            updateTime();
            setInterval(updateTime, 60000);
            
            console.log('🎯 页面初始化完成');
        });

        console.log('📄 JavaScript代码加载完成');
    </script>
</body>
</html>
