<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>善治美平台公益 to C 开放</title>
    <meta name="description" content="善治美平台公益 to C 开放，支持村民申请、助力金发放等功能">
    <meta name="keywords" content="善治美,公益平台,村民申请,助力金发放">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', '微软雅黑', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 40px 20px;
            text-align: center;
        }
        
        .hero {
            background: white;
            border-radius: 20px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }
        
        .hero h1 {
            font-size: 48px;
            color: #2c5aa0;
            margin-bottom: 20px;
            font-weight: 700;
        }
        
        .hero p {
            font-size: 20px;
            color: #666;
            margin-bottom: 40px;
            line-height: 1.8;
        }
        
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }
        
        .feature {
            background: rgba(255,255,255,0.9);
            padding: 30px 20px;
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }
        
        .feature-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        
        .feature h3 {
            color: #2c5aa0;
            margin-bottom: 10px;
            font-size: 18px;
        }
        
        .feature p {
            color: #666;
            font-size: 14px;
        }
        
        .cta-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .cta-button {
            display: inline-block;
            color: white;
            padding: 18px 40px;
            border-radius: 50px;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .cta-button.primary {
            background: #2c5aa0;
        }
        
        .cta-button.secondary {
            background: #28a745;
        }
        
        .cta-button.tertiary {
            background: #17a2b8;
        }
        
        .cta-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
        }
        
        .cta-button.primary:hover {
            background: #1e3d6f;
        }
        
        .cta-button.secondary:hover {
            background: #1e7e34;
        }
        
        .cta-button.tertiary:hover {
            background: #117a8b;
        }
        
        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 40px;
        }
        
        .page-card {
            background: rgba(255,255,255,0.95);
            border-radius: 15px;
            padding: 25px;
            text-align: left;
            transition: transform 0.3s ease;
        }
        
        .page-card:hover {
            transform: translateY(-5px);
        }
        
        .page-card h4 {
            color: #2c5aa0;
            margin-bottom: 10px;
            font-size: 16px;
        }
        
        .page-card p {
            color: #666;
            font-size: 14px;
            margin-bottom: 15px;
        }
        
        .page-card a {
            color: #2c5aa0;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
        }
        
        .page-card a:hover {
            text-decoration: underline;
        }
        
        .footer {
            color: white;
            opacity: 0.8;
            font-size: 14px;
        }
        
        .footer a {
            color: white;
            text-decoration: none;
        }
        
        @media (max-width: 768px) {
            .hero {
                padding: 40px 20px;
            }
            
            .hero h1 {
                font-size: 36px;
            }
            
            .hero p {
                font-size: 16px;
            }
            
            .features {
                grid-template-columns: 1fr;
            }
            
            .cta-buttons {
                flex-direction: column;
                align-items: center;
            }
            
            .pages-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>🏘️ 善治美平台公益 to C 开放</h1>
            
            <div style="background: #f8f9fa; border-radius: 12px; padding: 30px; margin: 30px 0; text-align: left;">
                <h3 style="color: #2c5aa0; margin-bottom: 20px;">业务目标：</h3>
                <div style="color: #333; font-size: 16px; line-height: 1.8;">
                    <p style="margin-bottom: 10px;">1）剔除现有需要助力金才可以申请的门槛</p>
                    <p style="margin-bottom: 10px;">2）针对入驻村民开放申请能力</p>
                    <p style="margin-bottom: 10px;">3）针对未入驻村庄，村民可以预申请能力</p>
                </div>
            </div>
            
            <div style="margin: 40px 0; color: #666; font-size: 18px; font-weight: 600;">
                体验界面
            </div>
            
            <div class="cta-buttons">
                <a href="乡村公益平台完整版-新版.html" class="cta-button primary">
                    🏘️ 开放 C 端申请流程
                </a>
                <a href="批量下发工具.html" class="cta-button secondary">
                    💰 助力金发放工具
                </a>
            </div>
        </div>
        
        <div class="footer">
            <p>© 2025 善治美平台公益 to C 开放</p>
        </div>
    </div>
</body>
</html>
